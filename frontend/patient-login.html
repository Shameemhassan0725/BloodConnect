<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Patient Login - BloodConnect</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="navbar">

        <div class="logo">
            Blood<span>Connect</span>
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="find-blood.html">
                Find Blood
            </a>

            <a href="register.html">
                Become a Donor
            </a>

            <a href="patient-register.html">
                Register
            </a>

        </nav>

    </header>


    <!-- =========================
         PATIENT LOGIN
    ========================== -->

    <main class="login-container">

        <div class="login-card">

            <div class="login-header">

                <div class="login-icon">
                    🩸
                </div>

                <h1>
                    Patient Login
                </h1>

                <p>
                    Login to manage your blood requests
                    and find available donors.
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form id="patientLoginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>


                <p
                    id="patientLoginMessage"
                    class="form-message">
                </p>

            </form>


            <!-- REGISTER LINK -->

            <div class="login-footer">

                <p>
                    Don't have a patient account?
                </p>

                <a href="patient-register.html">
                    Create Patient Account
                </a>

            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 BloodConnect.
            Emergency Blood Donor Finder.
        </p>

    </footer>


    <script src="js/patient-login.js"></script>

</body>

</html>
