<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Find Blood | BloodConnect</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            🩸 BloodConnect
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="find-blood.html">
                Find Blood
            </a>

            <a href="register.html">
                Become a Donor
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- FIND BLOOD -->

    <main class="find-page">

        <div class="find-container">

            <div class="find-header">

                <p class="tagline">
                    EMERGENCY BLOOD SEARCH
                </p>

                <h1>
                    Find a Blood Donor
                </h1>

                <p>
                    Search for available donors by
                    blood group and city.
                </p>

            </div>


            <!-- SEARCH FORM -->

            <form id="searchForm"
                  class="search-form">


                <div class="search-field">

                    <label for="searchBloodGroup">
                        Blood Group
                    </label>

                    <select
                        id="searchBloodGroup"
                        required
                    >

                        <option value="">
                            Select Blood Group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>

                        <option value="B+">B+</option>
                        <option value="B-">B-</option>

                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>

                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>


                <div class="search-field">

                    <label for="searchCity">
                        City
                    </label>

                    <input
                        type="text"
                        id="searchCity"
                        placeholder="Enter city"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="search-btn"
                >
                    🔎 Find Donors
                </button>

            </form>


            <!-- SEARCH MESSAGE -->

            <div id="searchMessage"></div>


            <!-- RESULTS -->

            <section
                id="resultsSection"
                class="results-section"
            >

                <h2>
                    Available Donors
                </h2>

                <div id="donorResults"
                     class="donor-results">
                </div>

            </section>

        </div>

    </main>


    <script src="js/find-blood.js"></script>

</body>

</html>
