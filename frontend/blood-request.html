<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Request Blood - BloodConnect</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="navbar">

        <div class="logo">
            Blood<span>Connect</span>
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="find-blood.html">
                Find Blood
            </a>

            <a href="patient-dashboard.html">
                Dashboard
            </a>

            <button
                id="logoutBtn"
                class="logout-btn">

                Logout

            </button>

        </nav>

    </header>


    <!-- =========================
         BLOOD REQUEST
    ========================== -->

    <main class="request-container">

        <div class="request-card">


            <!-- Header -->

            <div class="request-header">

                <div class="request-icon">
                    🩸
                </div>

                <h1>
                    Request Blood
                </h1>

                <p>
                    Submit your blood requirement
                    and help donors understand your need.
                </p>

            </div>


            <!-- Request Form -->

            <form id="bloodRequestForm">


                <!-- Blood Group -->

                <div class="form-group">

                    <label for="bloodGroup">
                        Blood Group Required
                    </label>

                    <select
                        id="bloodGroup"
                        required>

                        <option value="">
                            Select Blood Group
                        </option>

                        <option value="A+">
                            A+
                        </option>

                        <option value="A-">
                            A-
                        </option>

                        <option value="B+">
                            B+
                        </option>

                        <option value="B-">
                            B-
                        </option>

                        <option value="AB+">
                            AB+
                        </option>

                        <option value="AB-">
                            AB-
                        </option>

                        <option value="O+">
                            O+
                        </option>

                        <option value="O-">
                            O-
                        </option>

                    </select>

                </div>


                <!-- Units -->

                <div class="form-group">

                    <label for="units">
                        Units Required
                    </label>

                    <input
                        type="number"
                        id="units"
                        min="1"
                        max="20"
                        placeholder="Example: 2"
                        required>

                </div>


                <!-- Hospital -->

                <div class="form-group">

                    <label for="hospital">
                        Hospital Name
                    </label>

                    <input
                        type="text"
                        id="hospital"
                        placeholder="Enter hospital name"
                        required>

                </div>


                <!-- City -->

                <div class="form-group">

                    <label for="city">
                        Hospital City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter city"
                        required>

                </div>


                <!-- Required Date -->

                <div class="form-group">

                    <label for="requiredDate">
                        Required Date
                    </label>

                    <input
                        type="date"
                        id="requiredDate"
                        required>

                </div>


                <!-- Urgency -->

                <div class="form-group">

                    <label for="urgency">
                        Urgency
                    </label>

                    <select
                        id="urgency"
                        required>

                        <option value="">
                            Select Urgency
                        </option>

                        <option value="Normal">
                            Normal
                        </option>

                        <option value="Urgent">
                            Urgent
                        </option>

                        <option value="Emergency">
                            Emergency
                        </option>

                    </select>

                </div>


                <!-- Message -->

                <div class="form-group full-width">

                    <label for="message">
                        Additional Message
                    </label>

                    <textarea
                        id="message"
                        rows="4"
                        placeholder="Enter any additional information..."></textarea>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="request-submit-btn">

                    Submit Blood Request

                </button>


                <!-- Message -->

                <p
                    id="requestMessage"
                    class="form-message">
                </p>

            </form>


            <!-- Back -->

            <div class="request-footer">

                <a href="patient-dashboard.html">
                    ← Back to Dashboard
                </a>

            </div>

        </div>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 BloodConnect.
            Emergency Blood Donor Finder.
        </p>

    </footer>


    <script src="js/blood-request.js"></script>

</body>

</html>
