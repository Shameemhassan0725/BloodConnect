<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Patient Registration - BloodConnect</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header>

        <div class="logo">
            🩸 BloodConnect
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="find-blood.html">
                Find Blood
            </a>

            <a href="login.html">
                Donor Login
            </a>

        </nav>

    </header>


    <main class="register-container">

        <div class="register-card">

            <div class="register-header">

                <div class="register-icon">
                    🏥
                </div>

                <h1>
                    Patient Registration
                </h1>

                <p>
                    Create an account to find blood donors
                    and manage your blood requests.
                </p>

            </div>


            <form id="patientRegisterForm">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <!-- AGE -->

                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Enter your age"
                        min="1"
                        max="120"
                        required
                    >

                </div>


                <!-- GENDER -->

                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select id="gender" required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- CITY -->

                <div class="form-group">

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter your city"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Patient Account
                </button>


                <p
                    id="patientRegisterMessage"
                    class="form-message"
                ></p>


            </form>


            <div class="register-footer">

                Already have an account?

                <a href="patient-login.html">
                    Patient Login
                </a>

            </div>

        </div>

    </main>


    <script src="js/patient-register.js"></script>

</body>

</html>
