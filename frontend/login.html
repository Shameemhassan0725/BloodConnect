<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | BloodConnect</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <div class="logo">
            🩸 BloodConnect
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="find-blood.html">
                Find Blood
            </a>

            <a href="register.html">
                Become a Donor
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <main class="form-page">

        <div class="form-container">

            <h1>
                Donor Login
            </h1>

            <p>
                Login to manage your donor profile.
            </p>


            <form id="loginForm">


                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="register-btn"
                >
                    Login
                </button>


            </form>


            <div id="loginMessage"></div>


        </div>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
