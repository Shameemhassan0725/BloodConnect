<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Become a Donor | BloodConnect</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            🩸 BloodConnect
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="find-blood.html">Find Blood</a>

            <a href="register.html">Become a Donor</a>

            <a href="login.html">Login</a>

        </nav>

    </header>


    <!-- REGISTRATION FORM -->

    <main class="form-page">

        <div class="form-container">

            <h1>Become a Blood Donor</h1>

            <p>
                Register yourself and help someone in an emergency.
            </p>


            <form id="registerForm">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>
                <div class="form-group">

    <label for="password">
        Password
    </label>

    <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
    >

</div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <!-- BLOOD GROUP -->

                <div class="form-group">

                    <label for="bloodGroup">
                        Blood Group
                    </label>

                    <select id="bloodGroup" required>

                        <option value="">
                            Select Blood Group
                        </option>

                        <option value="A+">A+</option>

                        <option value="A-">A-</option>

                        <option value="B+">B+</option>

                        <option value="B-">B-</option>

                        <option value="AB+">AB+</option>

                        <option value="AB-">AB-</option>

                        <option value="O+">O+</option>

                        <option value="O-">O-</option>

                    </select>

                </div>


                <!-- AGE -->

                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Enter your age"
                        min="18"
                        max="65"
                        required
                    >

                </div>


                <!-- GENDER -->

                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select id="gender" required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- CITY -->

                <div class="form-group">

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter your city"
                        required
                    >

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="register-btn"
                >
                    Register as Donor
                </button>


            </form>


            <!-- MESSAGE -->

            <div id="message"></div>


        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="js/register.js"></script>

</body>

</html>
